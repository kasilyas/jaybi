server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Docker peut attribuer une nouvelle adresse interne à l’API après un
  # redémarrage. Résoudre son nom dynamiquement évite les réponses 502.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $jaybi_api api;

  location /api/ {
    proxy_pass http://$jaybi_api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://$jaybi_api:4000;
  }

  location = /ready {
    proxy_pass http://$jaybi_api:4000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
