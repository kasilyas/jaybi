# Jaybi - Orchestration locale (PostgreSQL + API + Web)
# Usage :
#   docker compose up -d db            # démarre la base
#   docker compose run --rm seed       # applique migrations + seed (one-shot)
#   docker compose up -d api web       # démarre l'API et le front
services:
  # Boîte mail locale de test : les OTP restent dans Docker et sont lisibles
  # dans Mailpit. Ne jamais l'utiliser comme serveur SMTP de production.
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: jaybi-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    image: postgres:16-alpine
    container_name: jaybi-db
    environment:
      POSTGRES_USER: jaybi
      POSTGRES_PASSWORD: jaybi
      POSTGRES_DB: jaybi
    ports:
      - "5433:5432"
    volumes:
      - jaybi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaybi -d jaybi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runner
    container_name: jaybi-api
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://jaybi:jaybi@db:5432/jaybi?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Provide a strong JWT_SECRET of at least 32 characters}
      JWT_EXPIRES_IN: 7d
      DEV_BYPASS: "false"
      PORT: "4000"
      CORS_ORIGIN: "http://localhost:3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "Jaybi Local <no-reply@jaybi.local>"
      SMTP_REQUIRE_TLS: "false"
      LOCAL_MAILBOX_URL: "http://localhost:8025"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ready >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runner
    container_name: jaybi-scraping-worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://jaybi:jaybi@db:5432/jaybi?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Provide a strong JWT_SECRET of at least 32 characters}
      JWT_EXPIRES_IN: 7d
      DEV_BYPASS: "false"
    command: ["node", "dist/scraping/worker.js"]
    restart: unless-stopped

  # Service one-shot : applique les migrations et charge le seed.
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: seed
    container_name: jaybi-seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://jaybi:jaybi@db:5432/jaybi?schema=public"
      DEV_BYPASS: "true"
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jaybi-web
    depends_on:
      - api
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  jaybi-db-data:
